name: maxdizi

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Çift yayın çalışmasını engeller: Yeni push geldiğinde eski çalışan yayını otomatik durdurur.
concurrency:
  group: maxdizii-stream
  cancel-in-progress: true

jobs:
  yayin:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
    - name: 📥 Depoyu klonla
      uses: actions/checkout@v4
      
    - name: 🐍 Python kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: 📦 FFmpeg ve Kurulumlar
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ffmpeg ca-certificates openssl
        pip install requests

    - name: 📥 Kayıtlı State Dosyasını İndir
      continue-on-error: true
      run: |
        curl -sL https://github.com/${{ github.repository }}/releases/download/state-data/state_maxdizi.json -o state_maxdizi.json

    - name: 🚀 Yayını başlat
      env:
        STATE_FILE_NAME: "state_maxdizi.json"
      run: python -u maxdizii.py

    - name: 💾 Son Durumu Release Üzerinde Güncelle
      if: always()
      uses: softprops/action-gh-release@v1
      with:
        files: state_maxdizi.json
        tag_name: state-data
        name: "Yayın Kaldığı Yer (State)"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 🔁 Otomatik Yeniden Tetikle (Elle İptal veya Süre Dolması)
      # Kod Push yapıldığında eski yayın iptal edilince 2. yayın tetiklenmez.
      # Ancak panellerden elle Cancel yaptığınızda otomatik yeni yayın başlar!
      if: always() && !(github.event_name == 'push' && cancelled())
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: |
        curl -X POST \
          -H "Authorization: token $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${{ github.repository }}/actions/workflows/maxdizii.yml/dispatches" \
          -d '{"ref":"${{ github.ref_name }}"}'
